<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gig thumbnails</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1280px;height:769px;background:#060b19;font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.t{position:relative;width:1280px;height:769px;overflow:hidden;background:
 radial-gradient(640px 560px at 78% 34%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 72%),
 radial-gradient(760px 520px at 0% 105%,color-mix(in srgb,var(--acc2) 16%,transparent),transparent 70%),
 linear-gradient(135deg,#050a18 0%,#0a1430 55%,#071027 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1.6px,transparent 1.7px);background-size:34px 34px;-webkit-mask-image:radial-gradient(60% 80% at 82% 40%,#000,transparent);mask-image:radial-gradient(60% 80% at 82% 40%,#000,transparent)}
.streak{position:absolute;left:-40px;top:-10px;width:900px;height:3px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.55;transform:rotate(-1.6deg)}

/* left column */
.left{position:absolute;left:60px;top:58px;bottom:50px;width:780px;display:flex;flex-direction:column;justify-content:space-between}
.h1{margin:0;font-family:'Barlow Condensed',Impact,sans-serif;font-weight:800;text-transform:uppercase;line-height:.9;letter-spacing:-.005em}
.h1 span{display:block;width:max-content;white-space:nowrap}
.h1 .l2{color:var(--acc);text-shadow:0 0 44px color-mix(in srgb,var(--acc) 45%,transparent)}
.tech{display:flex;align-items:center;gap:22px;margin-top:26px;font-size:40px;font-weight:700;color:#eaf0ff}
.tech .it{display:flex;align-items:center;gap:12px}
.tech svg{width:42px;height:42px}
.tech .dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.sub{margin-top:24px;font-size:42px;font-weight:600;color:#dbe4fa;letter-spacing:-.01em}
.grp{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.pill{display:inline-flex;align-items:center;gap:11px;height:68px;padding:0 24px;border-radius:999px;font-size:27px;font-weight:700;white-space:nowrap;color:#fff;border:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 15%,#0a1226);box-shadow:0 0 30px color-mix(in srgb,var(--acc) 38%,transparent)}
.pill svg{width:30px;height:30px}
.bar{display:flex;gap:36px;align-items:center;padding-top:26px;border-top:2px solid rgba(255,255,255,.14);font-size:28px;font-weight:600;color:#d3dcf3}
.bar .it{display:flex;align-items:center;gap:12px}
.bar svg{width:32px;height:32px;color:var(--acc)}

/* right cluster */
.pwrap{position:absolute;left:885px;top:64px;width:330px;height:330px}
.glow{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 50%,transparent),transparent 72%);filter:blur(8px)}
.orbit{position:absolute;inset:-34px;border-radius:50%;border:2px dashed rgba(255,255,255,.2)}
.orbit i{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 18px var(--acc)}
.ring{position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 210deg,var(--acc),rgba(255,255,255,.05) 38%,var(--acc2) 66%,var(--acc));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 7px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 7px))}
.photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#0a1226;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.photo img{position:absolute;width:647px;height:647px;left:-206px;top:-62px;filter:contrast(1.04) saturate(1.05) brightness(1.06)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,12,28,1) 0,rgba(7,12,28,.96) 9%,rgba(7,12,28,0) 19%)}
.name{position:absolute;left:872px;top:398px;display:flex;align-items:center;gap:14px;padding:14px 28px 14px 20px;border-radius:20px;background:rgba(7,12,28,.88);border:2px solid color-mix(in srgb,var(--acc) 75%,transparent);box-shadow:0 10px 34px rgba(0,0,0,.45),0 0 26px color-mix(in srgb,var(--acc) 30%,transparent)}
.name .av{width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.name b{display:block;font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.name small{display:block;font-size:19px;color:#aebbd8;font-weight:500;margin-top:2px}

/* gig visuals */
.vis{position:absolute;left:850px;top:500px;width:400px;height:230px}
.win{position:absolute;border-radius:14px;background:#0d1a38;border:2px solid color-mix(in srgb,var(--acc) 60%,transparent);box-shadow:0 14px 36px rgba(0,0,0,.5),0 0 30px color-mix(in srgb,var(--acc) 25%,transparent);overflow:hidden}
.wbar{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;background:rgba(255,255,255,.07)}
.wbar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45)}
.wbody{padding:14px 14px}
.wcode b{display:block;height:9px;border-radius:5px;background:rgba(255,255,255,.2);margin-bottom:9px}
.wcode b:nth-child(2){width:70%;background:color-mix(in srgb,var(--acc) 70%,#fff 0%)}
.wcode b:nth-child(3){width:50%}
.wlabel{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:46px;letter-spacing:.04em;color:var(--acc);line-height:1}
.arrows{position:absolute;left:150px;top:78px;width:100px}
.dash{position:absolute;left:30px;top:6px;width:340px;height:214px;border-radius:16px;background:#f3f6ff;transform:perspective(900px) rotateY(-14deg) rotateZ(-3deg);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 44px color-mix(in srgb,var(--acc) 35%,transparent);overflow:hidden;color:#16213f}
.dash .tb{height:28px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#e4e9f8}
.dash .tb i{width:9px;height:9px;border-radius:50%;background:#b6c0de}
.dash .tb em{margin-left:10px;height:12px;width:120px;border-radius:6px;background:#cfd7ee}
.dash .bd{display:flex;height:186px}
.dash .sb{width:56px;background:#101a3a;padding:14px 12px;display:grid;gap:10px;align-content:start}
.dash .sb i{height:10px;border-radius:5px;background:rgba(255,255,255,.28)}
.dash .sb i:first-child{background:var(--acc)}
.dash .mn{flex:1;padding:12px 14px}
.dash .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dash .st div{height:46px;border-radius:9px;background:#fff;box-shadow:0 1px 4px rgba(20,30,70,.12);padding:8px}
.dash .st div b{display:block;height:7px;width:60%;border-radius:4px;background:#c7d0ea}
.dash .st div i{display:block;height:10px;width:80%;margin-top:8px;border-radius:4px;background:var(--acc)}
.dash .ch{margin-top:10px;height:80px;border-radius:9px;background:#fff;box-shadow:0 1px 4px rgba(20,30,70,.12);padding:10px 12px;display:flex;align-items:flex-end;gap:9px}
.dash .ch u{flex:1;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--acc) 35%,#fff)}
.dash .ch u:nth-child(odd){background:var(--acc)}
.phone{position:absolute;width:150px;height:236px;border-radius:30px 30px 0 0;background:#0a1226;border:6px solid #1c2a52;border-bottom:0;box-shadow:0 24px 50px rgba(0,0,0,.55),0 0 40px color-mix(in srgb,var(--acc) 35%,transparent);overflow:hidden}
.phone .sc{height:100%;padding:16px 12px;background:linear-gradient(#0f1d40,#0a1530)}
.phone .nt{width:44px;height:8px;border-radius:5px;background:#1c2a52;margin:0 auto 14px}
.phone .hd{height:46px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));margin-bottom:10px}
.phone .rw{height:30px;border-radius:9px;background:rgba(255,255,255,.1);margin-bottom:8px;display:flex;align-items:center;gap:8px;padding:0 8px}
.phone .rw i{width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--acc) 60%,#fff 0%)}
.phone .rw b{height:7px;flex:1;border-radius:4px;background:rgba(255,255,255,.3)}
.phone .ok{position:absolute;right:12px;bottom:14px;width:34px;height:34px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.phone .ok svg{width:20px;height:20px;color:#04121b}
</style></head>
<body>
<div class="t" id="t">
  <div class="dots"></div><div class="streak"></div>
  <div class="left" id="left"></div>
  <div class="pwrap">
    <div class="glow"></div>
    <div class="orbit"><i style="left:14%;top:8%"></i><i style="right:6%;bottom:22%"></i></div>
    <div class="ring"></div>
    <div class="photo"><img src="portrait.webp" alt=""></div>
  </div>
  <div class="name"><span class="av"></span><div><b>Muhammad Awais</b><small>Full-Stack Developer</small></div></div>
  <div class="vis" id="vis"></div>
</div>
